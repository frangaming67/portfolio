<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="t d">
  <title id="t">Race-free booking in MediTurnos</title>
  <desc id="d">Left: with a check-then-insert in PHP, two patients both see the slot as free and both bookings are inserted. Right: with a UNIQUE index on a generated column, the database accepts the first insert and rejects the second with error 1062.</desc>
  <defs>
    <style>
      .bg { fill: #0b0d12; }
      .panel { fill: #12151c; stroke: #232836; }
      .k { font: 600 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: .12em; }
      .h { font: 600 22px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #f5f5f7; }
      .m { font: 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #c9ced8; }
      .mb { font: 600 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .s { font: 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8b93a5; }
      .kw { fill: #ff7ab2; } .fn { fill: #6cb6ff; } .str { fill: #a5d6a7; } .num { fill: #ffb86b; }
      .red { fill: #ff6b6b; } .green { fill: #4ade80; } .dim { fill: #5b6375; }
      .lane { stroke: #2a3040; stroke-width: 2; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="760" rx="28"/>

  <!-- BEFORE -->
  <rect class="panel" x="36" y="36" width="552" height="420" rx="18"/>
  <text x="64" y="76" class="k red">BEFORE · CHECK, THEN INSERT</text>
  <text x="64" y="108" class="h">Two patients, one 10:00 slot</text>

  <line class="lane" x1="96" y1="150" x2="96" y2="410"/>
  <g>
    <circle cx="96" cy="164" r="7" fill="#6cb6ff"/>
    <text x="118" y="169" class="m"><tspan class="mb fn">A</tspan>  is it free?  →  yes</text>
    <circle cx="96" cy="224" r="7" fill="#c792ea"/>
    <text x="118" y="229" class="m"><tspan class="mb" fill="#c792ea">B</tspan>  is it free?  →  yes</text>
    <text x="118" y="258" class="s">both checks pass before either write lands</text>
    <circle cx="96" cy="304" r="7" fill="#6cb6ff"/>
    <text x="118" y="309" class="m"><tspan class="mb fn">A</tspan>  INSERT  →  <tspan class="green">ok</tspan></text>
    <circle cx="96" cy="364" r="7" fill="#c792ea"/>
    <text x="118" y="369" class="m"><tspan class="mb" fill="#c792ea">B</tspan>  INSERT  →  <tspan class="red">ok</tspan></text>
    <rect x="300" y="346" width="252" height="36" rx="18" fill="#ff6b6b" fill-opacity=".14"/>
    <text x="426" y="369" text-anchor="middle" class="mb red">double booking</text>
  </g>
  <text x="64" y="436" class="s">The gap between check and write never fully closes (TOCTOU).</text>

  <!-- AFTER -->
  <rect class="panel" x="612" y="36" width="552" height="420" rx="18"/>
  <text x="640" y="76" class="k green">AFTER · THE ENGINE ENFORCES IT</text>
  <text x="640" y="108" class="h">One wins. The other is told why.</text>

  <line class="lane" x1="672" y1="150" x2="672" y2="410"/>
  <g>
    <circle cx="672" cy="164" r="7" fill="#6cb6ff"/>
    <text x="694" y="169" class="m"><tspan class="mb fn">A</tspan>  INSERT  →  <tspan class="green">ok</tspan></text>
    <circle cx="672" cy="244" r="7" fill="#c792ea"/>
    <text x="694" y="249" class="m"><tspan class="mb" fill="#c792ea">B</tspan>  INSERT  →  <tspan class="red">ERROR 1062</tspan></text>
    <text x="694" y="276" class="s">duplicate entry for key uq_turno_slot</text>
    <circle cx="672" cy="344" r="7" fill="#4ade80"/>
    <text x="694" y="349" class="m">PHP maps 1062 → "That time was just</text>
    <text x="694" y="373" class="m">taken. Please pick another."</text>
  </g>
  <text x="640" y="436" class="s">InnoDB checks the unique index atomically. No window left.</text>

  <!-- SQL -->
  <rect class="panel" x="36" y="480" width="1128" height="244" rx="18"/>
  <text x="64" y="518" class="k dim">THE FIX · 2 STATEMENTS</text>
  <text x="64" y="560" class="m"><tspan class="kw">ALTER TABLE</tspan> turno <tspan class="kw">ADD COLUMN</tspan> slot_unico <tspan class="fn">VARCHAR</tspan>(<tspan class="num">60</tspan>)</text>
  <text x="88" y="588" class="m"><tspan class="kw">GENERATED ALWAYS AS</tspan> (<tspan class="fn">IF</tspan>(id_estado = <tspan class="num">5</tspan>, <tspan class="kw">NULL</tspan>, <tspan class="fn">CONCAT</tspan>(matricula, <tspan class="str">'|'</tspan>, fecha, <tspan class="str">'|'</tspan>, hora_inicio))) <tspan class="kw">STORED</tspan>;</text>
  <text x="64" y="630" class="m"><tspan class="kw">ALTER TABLE</tspan> turno <tspan class="kw">ADD CONSTRAINT</tspan> uq_turno_slot <tspan class="kw">UNIQUE</tspan> (slot_unico);</text>
  <text x="64" y="684" class="s">Cancelled bookings (state 5) become NULL, and NULLs never collide in a UNIQUE index:</text>
  <text x="64" y="706" class="s">the slot frees itself while the history row is kept.</text>
</svg>
